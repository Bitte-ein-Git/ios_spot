name: "🛠️ Build Eevee Tweak .deb files"

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Tweak Version (e.g. 4.2.0)"
        required: true
        default: "6.2.2"

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"
  THEOS: ${{ github.workspace }}/theos

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup of previous workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete completed runs to save storage
          RUN_IDS=$(gh run list --repo $GH_REPO --status completed --limit 100 --json databaseId -q '.[].databaseId')
          for RUN_ID in $RUN_IDS; do
            gh run delete $RUN_ID
          done

  build:
    runs-on: macos-latest
    steps:
    - name: 🔍 Checkout repository
      uses: actions/checkout@v4

    - name: 🏗️ Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'
   
    - name: 🛠️ Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: ${{ github.workspace }}/theos
        submodules: recursive

    - name: 📦 Install Dependencies
      run: |
        brew install make dpkg ldid
        echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 
     
    - name: 🧩 Prepare SwiftProtobuf (rootful)
      run: |
        mkdir -p swiftprotobuf && cd swiftprotobuf
        wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
        ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
        tar -xf data.tar.lzma
        cp -r Library/Frameworks/SwiftProtobuf.framework $THEOS/lib

    - name: 🧩 Prepare SwiftProtobuf (rootless)
      run: |
        mkdir -p swiftprotobuf-rootless && cd swiftprotobuf-rootless
        wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
        ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
        tar -xf data.tar.lzma
        cp -r var/jb/Library/Frameworks/SwiftProtobuf.framework $THEOS/lib/iphone/rootless

    - name: 🔨 Build Tweak (rootful)
      run: |
        make package FINALPACKAGE=1
        echo "FILENAME_RT=$(find packages -name '*iphoneos-arm.deb' | head -n1)" >> $GITHUB_ENV

    - name: 🔨 Build Tweak (rootless)
      run: |
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        echo "FILENAME_RL=$(find packages -name '*iphoneos-arm64.deb' | head -n1)" >> $GITHUB_ENV

    - name: 🚀 Create Patch Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.VERSION }}
        name: "v${{ inputs.VERSION }} - Patch only"
        files: |
          ${{ env.FILENAME_RT }}
          ${{ env.FILENAME_RL }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
