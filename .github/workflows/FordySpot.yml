name: "🌀• Build & Release „Fordy's Spotify+🗿“"

on:
  workflow_dispatch:
    inputs:
      spot_version:
        description: 'Version (z.B., 4.2.0)'
        default: "6.2.2"
        required: true

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Install Build Dependencies
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          pipx install --force https://github.com/SpotCompiled/pyzule-rw/archive/main.zip
          pipx inject cyan Pillow

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Download and Validate src.ipa
        run: |
          ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/src" | jq -r '.assets[] | select(.name == "src.ipa") | .url')
          curl -L -H "Authorization: token ${{ secrets.GH_TOKEN }}" -H "Accept: application/octet-stream" "$ASSET_URL" -o ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            exit 1
          fi

      - name: Prepare SwiftProtobuf for Tweak Build
        run: |
          mkdir swiftprotobuf && cd swiftprotobuf
          wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
          ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb
          tar -xf data.tar.lzma
          cp -r Library/Frameworks/SwiftProtobuf.framework $THEOS/lib
          cd ..
          mkdir swiftprotobuf-rootless && cd swiftprotobuf-rootless
          wget https://github.com/whoeevee/swift-protobuf/releases/download/${{ env.SWIFTPROTOBUF_VERSION }}/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
          ar -x org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm64.deb
          tar -xf data.tar.lzma
          cp -r var/jb/Library/Frameworks/SwiftProtobuf.framework $THEOS/lib/iphone/rootless

      - name: Build EeveeSpotify Tweak
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "EEVEE_DEB=$(find packages -name '*iphoneos-arm64.deb' | head -n 1)" >> $GITHUB_ENV
          echo "SWIFTPROTOBUF_ROOTFUL=${{ github.workspace }}/swiftprotobuf/org.swift.protobuf.swiftprotobuf_${{ env.SWIFTPROTOBUF_VERSION }}_iphoneos-arm.deb" >> $GITHUB_ENV

      - name: Download OpenSpotifySafariExtension
        run: |
          git clone https://github.com/BillyCurtis/OpenSpotifySafariExtension
          echo "OPENSPOTIFYSAFARIEXTENSION=OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex" >> $GITHUB_ENV

      - name: Setup Tools
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          xcrun clang -x c -arch arm64 ./insert_dylib/insert_dylib/main.c -I/usr/include/ -o insert-dylib
          sudo mv insert-dylib /usr/local/bin/
          git clone https://github.com/whoeevee/ivinject.git
          cp -r ./ivinject/KnownFrameworks ~/.ivinject
          wget https://github.com/whoeevee/ivinject/releases/download/first/ivinject-arm64
          sudo mv ivinject-arm64 /usr/local/bin/
          sudo chmod +x /usr/local/bin/ivinject-arm64
          wget https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.0/ipapatch.macos-arm64
          sudo mv ipapatch.macos-arm64 /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Inject Tweak into IPA
        run: |
          ivinject-arm64 spotify.ipa EeveeSpotify.ipa \
            -i "$EEVEE_DEB" "$SWIFTPROTOBUF_ROOTFUL" "$OPENSPOTIFYSAFARIEXTENSION" \
            -s - -d --level Optimal

      - name: Create Patched Package
        run: ipapatch -input EeveeSpotify.ipa -output EeveeSpotify-patched.ipa

      - name: Run Cyan
        run: |
          Cyan -i "EeveeSpotify-patched.ipa" \
               -o "FordySpot_v${{ github.event.inputs.spot_version }}.ipa" \
               -v "${{ github.event.inputs.spot_version }}" \
               -k spot.png \
               -n "Spotify+🗿" \
               -b com.spotify.client -u -w

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.spot_version }}"
          name: "Spotify+🗿 v${{ github.event.inputs.spot_version }}"
          files: |
            FordySpot_v${{ github.event.inputs.spot_version }}.ipa
            EeveeSpotify-patched.ipa
            ${{ env.EEVEE_DEB }}
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"